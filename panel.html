<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼用量表</title>
<style>
  :root {
    /* 浅蓝白：白底为主，浅蓝作强调。与 client.js 的调色板一致，固定不随宿主深色反转。 */
    --ink:        #2c4a6e;
    --ink-2:      #6b8bab;
    --ink-3:      #9db4cc;
    --brand:      #5686fe;
    --brand-hi:   #679efe;
    --brand-soft: #d3e2ff;
    --brand-tint: #edf3fe;
    --ok:         #12b76a;
    --warn:       #e69320;
    --err:        #e0574a;
    --bg:         #ffffff;
    --bg-2:       #fbfdff;
    --bg-3:       #f5f9ff;
    --line:       rgba(86,134,254,.17);
    --line-1:     rgba(86,134,254,.10);
    --line-3:     rgba(86,134,254,.30);
    --hover:      rgba(86,134,254,.08);
    --r:          12px;
    --r-sm:       8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 var(--dsw-font-family, -apple-system, "Segoe UI", system-ui, "Microsoft YaHei", sans-serif);    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 20px 24px 28px; }

  /* ── 顶栏 ─────────────────────────────────────── */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 1px solid var(--line-1);
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
  }
  .top h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  .top .sp { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12.5px;
    background: var(--hover); color: var(--ink-2);
  }
  .chip .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .chip .d.peak { background: var(--warn); }
  button {
    font: inherit; cursor: pointer; color: var(--ink-2);
    background: transparent; border: 1px solid var(--line-3);
    border-radius: var(--r-sm); padding: 6px 14px; font-size: 13px;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  button:hover { background: var(--hover); color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.p { background: var(--brand); color: #fff; border-color: transparent; }
  button.p:hover { filter: brightness(1.07); color: #fff; }

  /* ── 主视觉 ───────────────────────────────────── */
  .hero {
    display: grid; grid-template-columns: 1fr 152px; gap: 20px;
    align-items: center; padding: 2px 0 20px;
  }
  @media (max-width: 660px) { .hero { grid-template-columns: 1fr 104px; } }
  .hero .k { font-size: 12.5px; color: var(--ink-3); letter-spacing: .02em; }
  .hero .big {
    font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1.05;
    font-variant-numeric: tabular-nums; margin: 3px 0 4px; color: var(--ink);
  }
  .hero .big .c { font-size: .46em; font-weight: 550; color: var(--brand); margin-right: 2px; }
  .hero .sub { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .hero .sub b { font-weight: 650; color: var(--ink); }
  /* 立绘 + 心情文案纵向排列。
     原来 .art 是 flex 且默认 row，152px 的窄列里 img 和文案横向并排，
     中文会被挤成一列竖排单字（实测「游得挺欢」变成竖排）。 */
  .hero .art { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; min-width: 0; }
  .hero .art img {
    width: 100%; max-width: 152px; height: auto; display: block;
    filter: drop-shadow(0 8px 18px rgba(16,35,60,.16));
    animation: floaty 4.2s ease-in-out infinite;
  }
  @media (max-width: 660px) { .hero .art img { max-width: 104px; } }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  @media (prefers-reduced-motion: reduce) { .hero .art img { animation: none; } }
  .hero .mood {
    font-size: 12px; color: var(--ink-3); text-align: center;
    white-space: nowrap; writing-mode: horizontal-tb; letter-spacing: 0;
  }

  /* ── 指标 ─────────────────────────────────────── */
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-1); border-radius: var(--r); overflow: hidden; }
  @media (max-width: 620px) { .grid4 { grid-template-columns: repeat(2, 1fr); } }
  .cell { background: var(--bg); padding: 13px 15px; }
  .cell .k { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .cell .k i { width: 6px; height: 6px; border-radius: 2px; }
  .cell .v { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.015em; margin-top: 2px; }
  .cell .m { font-size: 11.5px; color: var(--ink-3); }

  /* ── 通用区块 ─────────────────────────────────── */
  .sec { margin-top: 24px; }
  .sec > h2 {
    display: flex; align-items: baseline; gap: 9px;
    font-size: 12.5px; font-weight: 650; letter-spacing: .03em;
    color: var(--ink-3); margin: 0 0 12px;
  }
  .sec > h2 .r { margin-left: auto; font-weight: 400; font-variant-numeric: tabular-nums; }

  .track { height: 7px; border-radius: 4px; overflow: hidden; background: var(--brand-soft); }
  .track > i { display: block; height: 100%; border-radius: 4px; transition: width .6s cubic-bezier(.22,1,.36,1), background .3s; }
  .seg { display: flex; gap: 2.5px; height: 7px; border-radius: 4px; overflow: hidden; background: var(--hover); margin-bottom: 13px; }
  .seg > i { display: block; height: 100%; transition: flex-grow .5s ease; }

  .row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: var(--r-sm); font-size: 13.5px; transition: background .12s ease; }
  .row:hover { background: var(--hover); }
  .row .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .n small { color: var(--ink-3); margin-left: 8px; }
  .row .t { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .row .c { min-width: 74px; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .row .p { min-width: 40px; text-align: right; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .sub-rows { display: none; padding: 3px 0 5px 32px; }
  .sub-rows.open { display: block; }
  .sub-rows .r { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--ink-2); padding: 4px 0; }
  .sub-rows .r .mn { color: var(--ink); }
  .sub-rows .r .mt { margin-left: auto; font-variant-numeric: tabular-nums; }
  .sub-rows .r .mc { min-width: 68px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

  .wins { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 1px; background: var(--line-1); border-radius: var(--r); overflow: hidden; }
  .win { background: var(--bg); padding: 12px 15px; }
  .win .t { font-size: 12px; color: var(--ink-3); }
  .win .c { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.015em; margin: 2px 0; }
  .win .l { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .chart { width: 100%; display: block; }
  .chart .g { stroke: var(--line-1); stroke-width: 1; }
  .chart .ax { fill: var(--ink-3); font-size: 11px; }
  .chart .ar { fill: var(--brand); opacity: .1; }
  .chart .ln { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .pk { fill: var(--warn); opacity: .1; }
  .chart .br { fill: var(--brand); opacity: .28; transition: opacity .12s ease; }
  .chart .br:hover { opacity: .7; }
  .chart .pt { fill: var(--bg); stroke: var(--brand); stroke-width: 2; }

  .sess { display: flex; flex-direction: column; gap: 2px; }
  .srow { position: relative; display: flex; align-items: baseline; gap: 12px; padding: 10px 12px; border-radius: var(--r-sm); overflow: hidden; }
  .srow .f { position: absolute; inset: 0 auto 0 0; background: var(--brand); opacity: .08; transition: width .6s cubic-bezier(.22,1,.36,1); }
  .srow > * { position: relative; }
  .srow .st { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .srow .st small { color: var(--ink-3); margin-left: 8px; }
  .srow .tk { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .srow .cs { min-width: 72px; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; font-size: 13.5px; }

  .foot { display: flex; flex-wrap: wrap; gap: 5px 18px; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line-1); font-size: 12px; color: var(--ink-3); }
  .foot b { font-weight: 550; color: var(--ink-2); }
  .diag {
    margin-top: 10px; padding: 10px 12px; border-radius: var(--r-sm, 6px);
    background: rgba(247,144,9,.08); border: 1px solid rgba(247,144,9,.28);
    font-size: 12px; line-height: 1.6; color: var(--warn, #b45309);
  }
  .diag[hidden] { display: none; }

  .cfg { display: none; }
  .cfg.open { display: block; }
  .fld { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; font-size: 13.5px; }
  .fld label { min-width: 104px; color: var(--ink-2); }
  .fld input {
    font: inherit; font-size: 12px; padding: 4px 9px; width: 104px;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--bg-2); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .fld input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
  .fld .h { color: var(--ink-3); font-size: 11px; }

  .mask { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20; font-size: 12px; color: var(--ink-3); }
  .mask[hidden] { display: none; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-3); border-top-color: var(--brand); animation: sp .75s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .err { color: var(--err); }
</style>
</head>
<body>
<script>
/* 应用文档把宿主字体族递进来（iframe 里拿不到）；配色固定在面板自身，不跟随主题。 */
(function () {
  window.addEventListener('message', function (e) {
    var d = e.data
    if (!d || d.type !== 'whale-meter:theme' || !d.theme) return
    if (d.theme.font) document.documentElement.style.setProperty('--dsw-font-family', d.theme.font)
  })
})()
</script>
<div class="mask" id="mask"><span><span class="spin"></span><span id="maskTxt">正在读取会话日志…</span></span></div>

<div class="wrap">
  <div class="top">
    <h1>大肥鱼用量表</h1>
    <span class="chip" id="chip"><span class="d" id="chipDot"></span><span id="chipTxt">—</span></span>
    <span class="sp"></span>
    <button id="btnCfg">价目</button>
    <button id="btnRefresh" class="p">刷新</button>
  </div>

  <div class="hero">
    <div>
      <div class="k">今日费用</div>
      <div class="big"><span class="c" id="cur">¥</span><span id="bigCost">—</span></div>
      <div class="sub"><b id="bigTok">—</b> token · <span id="bigReq">—</span> 次请求</div>
    </div>
    <div class="art">
      <img id="artImg" src="/whale-meter/art/whale-stand.webp" alt="大肥鱼" />
      <div class="mood" id="moodTxt"></div>
    </div>
  </div>

  <div class="grid4">
    <div class="cell"><div class="k"><i style="background:var(--brand)"></i>未缓存输入</div><div class="v" id="cIn">—</div><div class="m">按全价计费</div></div>
    <div class="cell"><div class="k"><i style="background:var(--ok)"></i>输出</div><div class="v" id="cOut">—</div><div class="m">生成内容</div></div>
    <div class="cell"><div class="k"><i style="background:var(--warn)"></i>缓存命中</div><div class="v" id="cCache">—</div><div class="m" id="cCacheM">—</div></div>
    <div class="cell"><div class="k"><i style="background:var(--ink-3)"></i>请求数</div><div class="v" id="cReq">—</div><div class="m">模型调用次数</div></div>
  </div>

  <div class="sec">
    <h2>预算进度 <span class="r" id="budgetHint"></span></h2>
    <div class="fld" style="margin-bottom:6px"><label style="min-width:44px">今日</label>
      <div class="track" style="flex:1" id="barDay"><i style="width:0"></i></div>
      <span class="h" id="txtDay" style="min-width:112px;text-align:right"></span>
    </div>
    <div class="fld" style="margin-bottom:0"><label style="min-width:44px">本月</label>
      <div class="track" style="flex:1" id="barMonth"><i style="width:0"></i></div>
      <span class="h" id="txtMonth" style="min-width:112px;text-align:right"></span>
    </div>
  </div>

  <div class="sec">
    <h2>供应商分布 <span class="r" id="provHint">按 token 占比</span></h2>
    <div class="seg" id="provSeg"></div>
    <div id="provList"></div>
  </div>

  <div class="sec">
    <h2>时间窗口</h2>
    <div class="wins" id="wins"></div>
  </div>

  <div class="sec">
    <h2>近 24 小时 <span class="r" id="hintHour">橙带为峰时</span></h2>
    <svg class="chart" id="chartHour" viewBox="0 0 760 132" preserveAspectRatio="none" role="img" aria-label="近 24 小时 token"></svg>
  </div>

  <div class="sec">
    <h2>近 14 天 <span class="r">柱高为 token，悬停看当日费用</span></h2>
    <svg class="chart" id="chartDay" viewBox="0 0 760 132" preserveAspectRatio="none" role="img" aria-label="近 14 天用量"></svg>
  </div>

  <div class="sec">
    <h2>今日会话榜 <span class="r" id="sessHint">按费用排序</span></h2>
    <div class="sess" id="sessList"></div>
  </div>

  <div class="sec cfg" id="cfgPanel">
    <h2>价目与预算 <span class="r">写入 ~/.dsh/whale-meter-pricing.json</span></h2>
    <div class="fld"><label>每日预算</label><input id="fDay" type="number" min="1" step="1" /><span class="h">元</span></div>
    <div class="fld"><label>每月预算</label><input id="fMonth" type="number" min="1" step="1" /><span class="h">元</span></div>
    <div class="fld"><label>峰时区间</label><input id="fPeak" type="text" style="width:220px" /><span class="h">逗号分隔</span></div>
    <div class="fld"><label>价目模型</label><span class="h" id="fModels">—</span></div>
    <div class="fld"><label></label><button class="p" id="btnSave">保存</button><span class="h" id="fMsg"></span></div>
  </div>

  <div class="foot">
    <span>会话文件 <b id="fFiles">—</b></span>
    <span>扫描耗时 <b id="fMs">—</b></span>
    <span>刷新于 <b id="fWhen">—</b></span>
    <span>数据目录 <b id="fRoot">—</b></span>
    <span>立绘 <b>同人图 · 版权归画师（见 CREDITS.md）</b></span>
  </div>

  <div class="diag" id="diagNote" hidden></div>
</div>

<script>
(function () {
  'use strict'
  var PALETTE = ['#4176e6', '#679efe', '#8b76f6', '#e08700', '#dc3f33', '#39a8d8', '#4868b2']
  var MOOD = { idle: '今天还没喂鱼', calm: '鲸鱼很平静', busy: '游得挺欢', hot: '这条鱼有点烫手' }
  /* 与 client.js 同一套立绘池：11 张本仓库自绘的原创 SVG（MIT） */
  var ART_ALL = ['whale-stand','whale-ciallo','whale-praise','whale-bighead','whale-thinking',
                 'whale-confused','whale-coding','whale-goodmodel','whale-scold','whale-angry','whale-cdrive']
  var ART_URGENT = ['whale-scold','whale-angry','whale-cdrive','whale-confused']
  var snap = null
  var round = 0
  var $ = function (id) { return document.getElementById(id) }

  function fmtTok(n) {
    if (n === null || n === undefined || !isFinite(n)) return '—'
    if (n < 1000) return String(n)
    if (n < 1e6) return (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'K'
    if (n < 1e9) return (n / 1e6).toFixed(n < 1e8 ? 2 : 1) + 'M'
    return (n / 1e9).toFixed(2) + 'B'
  }
  function fmtMoney(n) { return (n === null || n === undefined || !isFinite(n)) ? '—' : n.toFixed(n < 1 ? 3 : 2) }
  function pctOf(x) { return Math.round(x * 100) + '%' }
  function hhmm(ms) { var d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }
  function ago(ms) { var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); return s < 60 ? s + ' 秒前' : s < 3600 ? Math.round(s / 60) + ' 分钟前' : Math.round(s / 3600) + ' 小时前' }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  /* 注意：这里必须用面板自己的变量名（--err/--warn/--brand），
     它们由 postMessage 从宿主 token 映射而来；直接用 --dsw-* 在 iframe 里解析不了。 */
  function colorFor(x) { return x >= 1 ? 'var(--err,#f04438)' : x >= 0.8 ? 'var(--warn,#f79009)' : 'var(--brand,#4176e6)' }

  function render(s) {
    snap = s
    var cur = s.currency === 'USD' ? '$' : '¥'
    $('cur').textContent = cur
    $('chipDot').className = 'd' + (s.peakNow ? ' peak' : '')
    $('chipTxt').textContent = s.peakNow ? '峰时' : '谷时'

    var t = s.windows.today
    $('bigCost').textContent = fmtMoney(t.cost)
    $('bigTok').textContent = fmtTok(t.totalTokens)
    $('bigReq').textContent = t.requestCount

    var mood = s.mood || 'calm'
    var p = Math.max(0, Math.min(1, s.pressure || 0))
    var n = round
    var art = (p >= 0.6 && n % 3 === 2) ? ART_URGENT[n % ART_URGENT.length] : ART_ALL[n % ART_ALL.length]
    round += 1
    $('artImg').src = '/whale-meter/art/' + art + '.webp'
    $('moodTxt').textContent = MOOD[mood] || ''

    var cached = t.cacheReadTokens, allIn = t.inputTokens + cached
    $('cIn').textContent = fmtTok(t.inputTokens)
    $('cOut').textContent = fmtTok(t.outputTokens)
    $('cCache').textContent = fmtTok(cached)
    $('cCacheM').textContent = allIn > 0 ? '占输入 ' + pctOf(cached / allIn) : '—'
    $('cReq').textContent = t.requestCount

    var d = s.budget.day, m = s.budget.month
    setBar('barDay', d.pct)
    setBar('barMonth', m.pct)
    $('txtDay').textContent = cur + fmtMoney(d.spent) + ' / ' + cur + fmtMoney(d.cap) + ' · ' + pctOf(d.pct)
    $('txtMonth').textContent = cur + fmtMoney(m.spent) + ' / ' + cur + fmtMoney(m.cap) + ' · ' + pctOf(m.pct)
    $('budgetHint').textContent = (s.pricing.intervals || []).join(' / ')

    providers(s, cur)
    windows(s, cur)
    hourChart(s)
    dayChart(s, cur)
    sessions(s, cur)

    var hl = s.health || {}
    $('fFiles').textContent = hl.scannedFiles || 0
    $('fMs').textContent = hl.scanMs ? (hl.scanMs / 1000).toFixed(1) + ' 秒' : '—'
    $('fWhen').textContent = hl.lastScanAt ? ago(hl.lastScanAt) : '—'
    $('fRoot').textContent = hl.sessionsRoot || '—'
    /* 环境自检：这三种 0 值不是「没用量」，是坏环境，必须显式说出来 */
    var diag = []
    if (hl.zstd === false) diag.push('运行时缺少 zstd 解压（需 Node 22.15+），压缩会话无法读取')
    if (hl.scannedFiles === 0) diag.push('会话目录为空或不可读，检查 DSH_HOME')
    if (hl.unreadable > 0) diag.push(hl.unreadable + ' 个会话文件读取失败')
    if ((s.unpricedModels || []).length > 0) {
      diag.push((s.unpricedModels || []).length + ' 种模型没有价目，金额偏低（' +
        fmtTok(s.windows.all.unpricedTokens || 0) + ' token 未计入）')
    }
    var dn = $('diagNote')
    if (dn) {
      dn.hidden = diag.length === 0
      dn.innerHTML = diag.map(function (x) { return '<div>· ' + esc(x) + '</div>' }).join('')
    }
  }

  function setBar(id, x) {
    var bar = $(id), i = bar.firstElementChild
    i.style.width = Math.min(100, x * 100) + '%'
    i.style.background = colorFor(x)
  }

  function providers(s, cur) {
    var seg = $('provSeg'), list = $('provList')
    seg.innerHTML = ''; list.innerHTML = ''
    var ps = (s.providers || []).filter(function (x) { return x.totals.totalTokens > 0 })
    if (!ps.length) { list.innerHTML = '<div class="row"><span class="n" style="color:var(--ink-3)">还没有可统计的用量</span></div>'; return }
    var total = ps.reduce(function (a, x) { return a + x.totals.totalTokens }, 0) || 1

    ps.forEach(function (x, i) {
      var col = PALETTE[i % PALETTE.length]
      var si = document.createElement('i')
      si.style.background = col
      si.style.flexGrow = Math.max(0.4, (x.totals.totalTokens / total) * 1000)
      si.title = x.provider + ' · ' + fmtTok(x.totals.totalTokens)
      seg.appendChild(si)

      var row = document.createElement('div')
      row.className = 'row'
      row.innerHTML =
        '<span class="dot" style="background:' + col + '"></span>' +
        '<span class="n">' + esc(x.provider) + '<small>' + x.models.length + ' 模型</small></span>' +
        '<span class="t">' + fmtTok(x.totals.totalTokens) + ' · ' + x.totals.requestCount + ' 次</span>' +
        '<span class="c">' + cur + fmtMoney(x.totals.cost) + '</span>' +
        '<span class="p">' + pctOf(x.totals.totalTokens / total) + '</span>'
      list.appendChild(row)

      var sub = document.createElement('div')
      sub.className = 'sub-rows'
      x.models.forEach(function (mm) {
        var r = document.createElement('div')
        r.className = 'r'
        r.innerHTML = '<span class="mn">' + esc(mm.model) + '</span>' +
          '<span class="mt">' + fmtTok(mm.totals.totalTokens) + '</span>' +
          '<span class="mc">' + cur + fmtMoney(mm.totals.cost) + '</span>'
        sub.appendChild(r)
      })
      list.appendChild(sub)
      row.addEventListener('click', function () { sub.classList.toggle('open') })
    })
  }

  function windows(s, cur) {
    var defs = [['last3h', '近 3 小时'], ['last12h', '近 12 小时'], ['last7d', '近 7 天'],
                ['last30d', '近 30 天'], ['month', '本月'], ['all', '全部']]
    var host = $('wins'); host.innerHTML = ''
    defs.forEach(function (dd) {
      var w = s.windows[dd[0]]
      if (!w) return
      var el = document.createElement('div')
      el.className = 'win'
      el.innerHTML = '<div class="t">' + dd[1] + '</div><div class="c">' + cur + fmtMoney(w.cost) +
        '</div><div class="l">' + fmtTok(w.totalTokens) + ' · ' + w.requestCount + ' 次</div>'
      host.appendChild(el)
    })
  }

  function hourChart(s) {
    var svg = $('chartHour'), W = 760, H = 132, PL = 42, PR = 8, PT = 10, PB = 20
    var data = s.hourly || []
    var max = Math.max(1, data.reduce(function (a, x) { return Math.max(a, x.tokens) }, 0))
    var iw = W - PL - PR, ih = H - PT - PB, step = iw / Math.max(1, data.length - 1)
    var X = function (i) { return PL + i * step }, Y = function (v) { return PT + ih - (v / max) * ih }
    var o = []
    data.forEach(function (x, i) { if (x.peak) o.push('<rect class="pk" x="' + X(i).toFixed(1) + '" y="' + PT + '" width="' + step.toFixed(1) + '" height="' + ih + '"/>') })
    for (var g = 0; g <= 2; g++) {
      var gy = PT + ih - (g / 2) * ih
      o.push('<line class="g" x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '"/>')
      o.push('<text class="ax" x="' + (PL - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end">' + fmtTok(Math.round(max * g / 2)) + '</text>')
    }
    var dl = '', da = ''
    data.forEach(function (x, i) { dl += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.tokens).toFixed(1) + ' ' })
    da = dl + 'L' + X(data.length - 1).toFixed(1) + ' ' + (PT + ih) + ' L' + X(0).toFixed(1) + ' ' + (PT + ih) + ' Z'
    o.push('<path class="ar" d="' + da + '"/><path class="ln" d="' + dl + '"/>')
    data.forEach(function (x, i) {
      if (i % 6) return
      o.push('<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(x.tokens).toFixed(1) + '" r="2.5"/>')
      o.push('<text class="ax" x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + hhmm(x.startTime) + '</text>')
    })
    svg.innerHTML = o.join('')
  }

  function dayChart(s, cur) {
    var svg = $('chartDay'), W = 760, H = 132, PL = 42, PR = 8, PT = 10, PB = 22
    var data = s.daily || []
    var max = Math.max(1, data.reduce(function (a, x) { return Math.max(a, x.tokens) }, 0))
    var iw = W - PL - PR, ih = H - PT - PB, slot = iw / Math.max(1, data.length), bw = Math.max(5, slot * 0.5)
    var o = []
    for (var g = 0; g <= 2; g++) {
      var gy = PT + ih - (g / 2) * ih
      o.push('<line class="g" x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy + '"/>')
      o.push('<text class="ax" x="' + (PL - 6) + '" y="' + (gy + 3.5) + '" text-anchor="end">' + fmtTok(Math.round(max * g / 2)) + '</text>')
    }
    data.forEach(function (x, i) {
      var bh = (x.tokens / max) * ih
      var bx = PL + i * slot + (slot - bw) / 2, by = PT + ih - bh
      var d = new Date(x.startTime)
      o.push('<rect class="br" x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + Math.max(1, bh).toFixed(1) + '" rx="2.5"><title>' + (d.getMonth() + 1) + '/' + d.getDate() +
        ' · ' + fmtTok(x.tokens) + ' token · ' + cur + fmtMoney(x.cost) + ' · ' + x.requests + ' 次</title></rect>')
      if (i % 2 === 0 || i === data.length - 1) {
        o.push('<text class="ax" x="' + (bx + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' +
          (d.getMonth() + 1) + '/' + d.getDate() + '</text>')
      }
    })
    svg.innerHTML = o.join('')
  }

  function sessions(s, cur) {
    var host = $('sessList'); host.innerHTML = ''
    var list = s.topSessions || []
    if (!list.length) { host.innerHTML = '<div class="row"><span class="n" style="color:var(--ink-3)">今天还没有会话记录</span></div>'; return }
    var max = Math.max(1, list[0].totals.cost)
    list.forEach(function (x) {
      var row = document.createElement('div')
      row.className = 'srow'
      row.innerHTML = '<span class="f" style="width:' + Math.max(2, (x.totals.cost / max) * 100) + '%"></span>' +
        '<span class="st">' + esc(x.title || String(x.id).replace(/^session-/, '').slice(0, 8)) +
        '<small>' + x.totals.requestCount + ' 次</small></span>' +
        '<span class="tk">' + fmtTok(x.totals.totalTokens) + '</span>' +
        '<span class="cs">' + cur + fmtMoney(x.totals.cost) + '</span>'
      row.title = (x.project || '') + '\n' + x.id
      host.appendChild(row)
    })
  }

  function load(force) {
    $('btnRefresh').disabled = true
    fetch('/api/whale-meter' + (force ? '?force=1' : ''), { headers: { accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
      .then(function (s) { render(s); $('mask').hidden = true })
      .catch(function (e) { $('maskTxt').innerHTML = '<span class="err">读取失败：' + esc(e.message) + '</span>'; setTimeout(function () { $('mask').hidden = true }, 1800) })
      .then(function () { $('btnRefresh').disabled = false })
  }

  $('btnRefresh').addEventListener('click', function () { load(true) })
  $('btnCfg').addEventListener('click', function () {
    var p = $('cfgPanel'); var on = p.classList.toggle('open')
    if (!on) return
    fetch('/api/whale-meter/config').then(function (r) { return r.json() }).then(function (c) {
      $('fDay').value = c.budget.day
      $('fMonth').value = c.budget.month
      $('fPeak').value = (c.peakSchedule.intervals || []).map(function (i) { return i.start + '-' + i.end }).join(',')
      $('fModels').textContent = Object.keys(c.pricing || {}).length + ' 个模型有价目'
    })
    p.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
  })
  $('btnSave').addEventListener('click', function () {
    var iv = $('fPeak').value.split(',').map(function (x) { return x.trim() }).filter(Boolean).map(function (x) {
      var m = x.split('-'); return { start: (m[0] || '').trim(), end: (m[1] || '').trim() }
    }).filter(function (i) { return /^\d{1,2}:\d{2}$/.test(i.start) && /^\d{1,2}:\d{2}$/.test(i.end) })
    $('fMsg').textContent = '保存中…'
    fetch('/api/whale-meter/config', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        budget: { day: Number($('fDay').value) || 30, month: Number($('fMonth').value) || 70 },
        peakSchedule: { weekendOffpeak: true, intervals: iv.length ? iv : [{ start: '09:00', end: '12:00' }, { start: '14:00', end: '18:00' }] },
      }),
    }).then(function (r) { return r.json() }).then(function (res) {
      $('fMsg').textContent = res.ok ? '已保存' : ('失败：' + (res.error || ''))
      if (res.ok) load(true)
      setTimeout(function () { $('fMsg').textContent = '' }, 2400)
    }).catch(function (e) { $('fMsg').textContent = '失败：' + e.message })
  })

  setInterval(function () { if (!document.hidden) load(false) }, 60000)
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(false) })
  load(false)
})()
</script>
</body>
</html>
